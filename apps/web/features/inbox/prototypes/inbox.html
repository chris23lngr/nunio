<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nunio · Inbox explorations</title>
<style>
:root{font-family:var(--font-sans,Inter,system-ui,sans-serif);color:var(--foreground,#232820);--ink:var(--foreground,#232820);--paper:var(--card,#fff);--soft:var(--secondary,#f4f5f0);--line:var(--border,#e0e4db);--green:var(--primary,#46633d);--radius:14px}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid var(--ring,#638052);outline-offset:3px}button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px}button:hover{filter:brightness(.96)}small,.muted{color:var(--muted-foreground,#747c70)}small{font-size:11px}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-1.2px;font-weight:550}h2{font-size:19px;font-weight:550;letter-spacing:-.5px}h3{font-size:14px;font-weight:570;line-height:1.5}p{font-size:12px;line-height:1.65}.intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:9px;font-weight:650;color:var(--muted-foreground,#747c70);margin-bottom:8px}.badge{border-radius:20px;background:var(--soft);padding:3px 8px;font-size:10px}.workspace{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper)}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}.brand{font-size:21px;letter-spacing:-1px;font-weight:700}.brand span{color:var(--green)}.top small{margin-left:18px}.trigger{display:flex;gap:8px;align-items:center;font-size:12px}.count{background:var(--green);color:var(--primary-foreground,#fff);border-radius:20px;padding:2px 6px;font-size:10px}.shell{display:flex;position:relative;min-height:520px}.rail{width:123px;flex:none;border-right:1px solid var(--line);padding:22px 12px;background:var(--soft)}.nav{padding:9px 10px;font-size:11px;margin-bottom:4px;border-radius:7px;color:var(--muted-foreground,#747c70)}.nav.active{background:var(--paper);color:var(--ink);font-weight:600}.main{padding:28px;flex:1;min-width:0}.sub{margin-top:8px;color:var(--muted-foreground,#747c70)}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:22px 0 0}.tabs button{padding:0 0 12px;border:0;border-radius:0;background:none;font-size:11px;color:var(--muted-foreground,#747c70)}.tabs button.selected{color:var(--ink);box-shadow:0 2px var(--green)}.item{padding:18px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}.icon{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--warning-surface,#f5eedb);color:var(--warning,#9e772e);font-size:15px}.icon.info{background:var(--info-surface,#edf0f4);color:var(--info,#54687e)}.icon.neutral{background:var(--soft);color:var(--muted-foreground,#747c70)}.item-body{flex:1;min-width:0}.meta{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted-foreground,#747c70);margin-bottom:5px}.item p{color:var(--muted-foreground,#747c70);margin-top:4px;font-size:11px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{font-size:10px;padding:6px 10px}.primary{background:var(--green);color:var(--primary-foreground,#fff);border-color:var(--green)}.quiet{border-color:transparent;background:none;color:var(--muted-foreground,#747c70)}.brief{background:var(--soft);padding:17px;border-radius:10px;margin-top:22px}.brief p{margin-top:6px}.brief details{margin-top:12px;font-size:11px;line-height:1.8}.brief summary{cursor:pointer}.brief ul{padding-left:16px}.brief li{margin:8px 0}.tag{font-size:9px;border:1px solid var(--line);border-radius:4px;padding:2px 5px;white-space:nowrap}.background-plan{flex:1;padding:28px;min-width:0}.plan-line{display:flex;border-bottom:1px solid var(--line);padding:18px 0;gap:16px;font-size:11px}.plan-block{border-left:3px solid var(--green);background:var(--soft);padding:12px;width:100%;border-radius:5px}.plan-line small{width:40px;flex:none}.sheet{width:385px;border-left:1px solid var(--line);background:var(--paper);padding:24px;position:relative;box-shadow:-12px 0 30px #00000008}.sheet .tabs{gap:15px}.sheet h1{font-size:24px}.sheet .item{padding:16px 0}.sheet .brief{margin-top:18px}.overlay-shade{position:absolute;inset:0;background:#18221817}.popover{position:absolute;right:14px;top:12px;width:365px;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 40px #00000015;padding:20px;z-index:1}.popover .item{padding:13px 0}.popover .brief{padding:13px;margin-top:14px}.popover .tabs{margin-top:16px}.popover .item p{display:none}.popover .icon{width:24px;height:24px;font-size:12px}.popover h3{font-size:12px}.popover .actions{margin-top:7px}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.foot button{font-size:10px}.dock{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px auto 0;width:max-content;max-width:100%;background:var(--ink);color:var(--paper);border-radius:30px;padding:6px;box-shadow:0 6px 20px #00000012}.dock button{border:0;background:transparent;color:inherit;border-radius:20px;font-size:11px;padding:8px 13px}.dock button.chosen{background:var(--paper);color:var(--ink)}.note{margin:14px 0 0;text-align:center;font-size:11px;color:var(--muted-foreground,#747c70)}.state{margin-top:12px;font-size:10px;color:var(--muted-foreground,#747c70);text-align:center}.empty{padding:30px 0}.close{border:0;background:none;padding:4px 8px;font-size:19px}.sheet-title{display:flex;justify-content:space-between;align-items:center}.prefs{background:var(--soft);padding:16px;margin-top:16px;border-radius:8px}.prefs p{margin-top:10px}.prefs button{margin-top:12px;font-size:11px}@media(max-width:550px){.rail{display:none}.main{padding:22px 18px}.sheet{width:100%;border:0;padding:22px 18px}.shell:has(.sheet)>.background-plan{display:none}.popover{width:calc(100% - 24px);right:12px}.top{padding:12px}.top small{display:none}.dock button{font-size:10px;padding:8px}.intro{align-items:start}.intro .badge{display:none}.background-plan{padding:22px 18px}.shell{min-height:550px}}
</style></head>
<body>
<!-- Throwaway design study: three inbox surfaces using representative /api/me/inbox data. No API mutations. -->
<div class="intro"><div><div class="eyebrow">nunio / design exploration</div><h2 id="concept"></h2></div><span class="badge">Interactive · sample data</span></div>
<div class="workspace"><header class="top"><div><span class="brand">nunio<span>✳</span></span><small>Your study workspace</small></div><button class="trigger" id="trigger" aria-expanded="true">Inbox <span class="count" id="count">3</span></button></header><div class="shell" id="app"></div></div>
<nav class="dock" aria-label="Prototype variants"><button id="prev" aria-label="Previous concept">←</button><button data-variant="A">A · Triage page</button><button data-variant="B">B · Side sheet</button><button data-variant="C">C · Inbox menu</button><button id="next" aria-label="Next concept">→</button></nav>
<p class="note" id="note"></p><p class="state" id="state" aria-live="polite"></p>
<script>
const records=[{id:'shortfall',kind:'shortfall',title:'Problem sheet 3',course:'Analysis I',shortMinutes:120,raisedAt:'2026-11-10T07:40:00Z',state:'open',closedAt:null,action:null},{id:'disagreement',kind:'disagreement',title:'Room 101',course:'Linear Algebra',shortMinutes:null,raisedAt:'2026-11-10T07:25:00Z',state:'open',closedAt:null,action:null},{id:'expired',kind:'approval_expired',title:'Problem sheet 1',course:'Analysis I',shortMinutes:null,raisedAt:'2026-11-10T07:00:00Z',state:'open',closedAt:null,action:{kind:'studyBlock.move',work:{title:'Problem sheet 1',course:'Analysis I'},from:{start:'2026-11-17T09:00:00Z',end:'2026-11-17T10:00:00Z'},to:{start:'2026-11-18T14:00:00Z',end:'2026-11-18T15:00:00Z'}}}];
const briefings=[{id:'briefing',madeAt:'2026-11-10T06:05:00Z',interventions:['shortfall','disagreement','expired'],approvals:[{actionId:'approval-1',state:'waiting',action:{kind:'studyBlock.add',work:{title:'Revision session',course:'Analysis I'}}}],responsibilities:[{id:'r-1',preset:'keep_course_organized',course:'Analysis I',exam:null}]}];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';let tab='attention',expanded=true,prefs=false;
const labels={A:'A / A dedicated place to triage',B:'B / Attention, alongside your plan',C:'C / A quick check, then back to work'};
const notes={A:'Best for working through several items. Briefings have a permanent place below the queue.',B:'Best for checking an issue without leaving your current page. Close and reopen the sheet with Inbox.',C:'Best for a small daily queue. Short rows, inline actions, and expandable briefing details.'};
function heading(i){if(i.kind==='shortfall')return i.shortMinutes===null?'No longer short for '+i.title:(i.shortMinutes/60)+' h short for '+i.title;if(i.kind==='disagreement')return 'Sources disagree about '+i.title;return 'Approval expired: move '+i.title;}
function item(i){const closed=i.state!=='open';return `<article class="item"><span aria-hidden="true" class="icon ${i.kind==='disagreement'?'info':i.kind==='approval_expired'?'neutral':''}">${i.kind==='shortfall'?'◷':i.kind==='disagreement'?'⇄':'↶'}</span><div class="item-body"><div class="meta"><span>${i.course}</span><span>${i.raisedAt.slice(11,16)}</span></div><h3>${heading(i)}</h3><p>${i.kind==='shortfall'?'Your current plan is missing 2 hours for this work.':i.kind==='disagreement'?'This fact has conflicting source information.':'The window to approve this block move has closed.'}</p>${closed?`<p>${i.state==='acknowledged'?'Acknowledged · the issue may still apply':'Dismissed as not useful'}</p>`:`<div class="actions"><button class="primary" data-close="${i.id}" data-as="acknowledged">Got it</button><button class="quiet" data-close="${i.id}" data-as="dismissed">Not useful</button></div>`}</div></article>`;}
function briefing(){return `<section class="brief"><div class="meta"><span>DAILY BRIEFING</span><span>10 Nov · 06:05</span></div><h3>Your study day, in one place.</h3><p>3 attention items · 1 approval · 1 responsibility</p><details ${tab==='briefings'?'open':''}><summary>Read briefing</summary><ul>${briefings[0].interventions.map(id=>{const i=records.find(i=>i.id===id);return `<li>${heading(i)} <span class="tag">${i.state}</span></li>`}).join('')}<li>Add a block for Revision session <span class="tag">Waiting for approval</span></li><li>Keep Analysis I organized</li></ul><small>Approval status is current. Approvals are managed separately.</small></details></section>`;}
function tabs(){return `<nav class="tabs" aria-label="Inbox sections">${[['attention','Attention · '+records.filter(i=>i.state==='open').length],['briefings','Briefings'],['history','History']].map(([key,label])=>`<button data-tab="${key}" class="${tab===key?'selected':''}" aria-current="${tab===key?'page':'false'}">${label}</button>`).join('')}</nav>`;}
function content(){if(prefs)return `<section class="prefs"><h3>Delivery preferences</h3><p>The current inbox supports a daily briefing time, email, push notifications, quiet hours, and a daily alert limit.</p><p>These controls would live in notification settings, keeping the inbox focused on attention items.</p><button id="back">Back to inbox</button></section>`;if(tab==='briefings')return briefing();let rows=records.filter(i=>tab==='history'?i.state!=='open':i.state==='open');return (rows.length?rows.map(item).join(''):`<div class="empty"><h3>${tab==='history'?'No closed items yet.':'Nothing needs your attention.'}</h3><p class="muted">${tab==='history'?'Acknowledge or dismiss an item to see it here.':'Your briefings are still available.'}</p></div>`)+(tab==='attention'&&variant!=='C'?briefing():'');}
function rail(){return `<aside class="rail" aria-label="App context">${['Home','Inbox','Review','Chat','Plan','Projects','Responsibilities'].map(n=>`<div class="nav ${n===(variant==='A'?'Inbox':'Plan')?'active':''}">${n}</div>`).join('')}</aside>`;}
function plan(){return `<section class="background-plan"><div class="eyebrow">Tuesday, 10 November</div><h1>Your plan</h1><p class="sub">A little structure. Room to focus.</p>${[['09:00','Problem sheet 3','Analysis I · Study block'],['11:00','Lecture notes','Linear Algebra · Study block'],['14:00','Revision session','Analysis I · Study block']].map(([time,title,desc])=>`<div class="plan-line"><small>${time}</small><div class="plan-block"><h3>${title}</h3><p class="muted">${desc}</p></div></div>`).join('')}<p class="sub">Illustrative plan context</p></section>`;}
function footer(){return `<div class="foot"><small>Acknowledging ≠ resolving</small><button class="quiet" id="prefs">Delivery settings</button></div>`;}
function draw(){document.getElementById('concept').textContent=labels[variant];document.getElementById('note').textContent=notes[variant];document.getElementById('count').textContent=records.filter(i=>i.state==='open').length;document.getElementById('trigger').setAttribute('aria-expanded',String(variant==='A'||expanded));document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('chosen',b.dataset.variant===variant));let body=variant==='A'?`<main class="main"><div class="eyebrow">Your attention, well spent</div><h1>Inbox</h1><p class="sub">What needs you. What nunio is keeping track of.</p>${tabs()}${content()}${footer()}</main>`:plan()+(expanded?(variant==='B'?`<aside class="sheet" aria-label="Inbox sheet"><div class="sheet-title"><h1>Inbox</h1><button class="close" id="close" aria-label="Close inbox">×</button></div><p class="sub">A quick pause to stay on track.</p>${tabs()}${content()}${footer()}</aside>`:`<div class="overlay-shade"></div><aside class="popover" aria-label="Inbox menu"><div class="sheet-title"><h2>Inbox</h2><button class="close" id="close" aria-label="Close inbox">×</button></div>${tabs()}${content()}${footer()}</aside>`):'');document.getElementById('app').innerHTML=rail()+body;document.getElementById('state').textContent='Preview state · '+records.filter(i=>i.state==='open').length+' open · '+records.filter(i=>i.state==='acknowledged').length+' acknowledged · '+records.filter(i=>i.state==='dismissed').length+' dismissed · local only';}
function choose(v){variant=v;expanded=true;prefs=false;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);draw();}function cycle(n){choose(['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3]);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variant)choose(b.dataset.variant);if(b.id==='prev')cycle(-1);if(b.id==='next')cycle(1);if(b.dataset.tab){tab=b.dataset.tab;prefs=false;draw();}if(b.dataset.close){const i=records.find(i=>i.id===b.dataset.close);i.state=b.dataset.as;i.closedAt=new Date().toISOString();draw();}if(b.id==='trigger'){expanded=!expanded;draw();}if(b.id==='close'){expanded=false;draw();document.getElementById('trigger').focus();}if(b.id==='prefs'||b.id==='back'){prefs=b.id==='prefs';draw();}});
document.addEventListener('keydown',e=>{if(e.target.closest?.('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}if(e.key==='Escape'&&variant!=='A'){expanded=false;draw();document.getElementById('trigger').focus();}});draw();
</script></body></html>
