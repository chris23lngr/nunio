# Checks on every PR and push to main; on main, then migrate and deploy staging in the order of
# docs/implementation-plan.md, Phase 2: a failing migration stops the pipeline before any deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. On main a newer push waits for the running one (replacing any already waiting),
# so migrations and deploys never overlap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Tests start Postgres with Testcontainers on the runner's Docker.
      - run: bun run build typecheck lint test
      - name: openapi.json is up to date (ADR-0003)
        run: |
          bun run openapi
          git diff --exit-code -- apps/api/openapi.json \
            || { echo "::error::apps/api/openapi.json is stale; run 'bun run openapi' and commit it."; exit 1; }
      - name: Local HTTPS names for the e2e suite
        run: echo "127.0.0.1 app.nunio.test api.nunio.test evil.test" | sudo tee -a /etc/hosts
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: bun run test:e2e

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Rules from AGENTS.md, "Commits". Commits up to the baseline predate them and are not linted.
      - name: Commit messages follow the rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASELINE: a2118f880b472544bf521621a69ee763ed6cc996
        run: |
          from=$BASE
          if git merge-base --is-ancestor "$BASELINE" "$HEAD" && ! git merge-base --is-ancestor "$BASELINE" "$BASE"; then
            from=$BASELINE
          fi
          bunx commitlint --from "$from" --to "$HEAD" --verbose

  spikes:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Spike e against the staging buckets and spike f against OpenRouter; both skip wherever their
      # variables are unset.
      - name: Spike e (Hetzner SSE-C)
        run: bunx vitest run spike-e
        working-directory: packages/knowledge
        env:
          HETZNER_S3_ENDPOINT: ${{ vars.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_REGION: ${{ vars.HETZNER_S3_REGION }}
          HETZNER_QUARANTINE_BUCKET: ${{ vars.HETZNER_QUARANTINE_BUCKET }}
          HETZNER_SOURCES_BUCKET: ${{ vars.HETZNER_SOURCES_BUCKET }}
          HETZNER_S3_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          HETZNER_S3_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
      - name: Spike f (OpenRouter)
        run: bunx vitest run spike-f
        working-directory: packages/ai
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
          OPENROUTER_CHAT_MODEL: ${{ vars.OPENROUTER_CHAT_MODEL }}
          OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}

  migrate:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The unpooled URL: migrations never go through the pooler.
      - run: bun run migrate:deploy
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ vars.VERCEL_API_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}

  deploy-worker:
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/render-deploy.sh "${{ vars.RENDER_WORKER_SERVICE_ID }}" "${{ github.sha }}"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  deploy-web:
    needs: deploy-worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ vars.VERCEL_WEB_PROJECT_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}

  staging-e2e:
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # global-setup imports @nunio/db/testing from dist.
      - run: bunx turbo run build --filter=@nunio/db
      # The hostile origin is always served from the runner.
      - run: echo "127.0.0.1 evil.test" | sudo tee -a /etc/hosts
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: bunx playwright test
        working-directory: apps/e2e
        env:
          E2E_TARGET: staging
          SPIKE_WEBHOOK_SECRET: ${{ secrets.SPIKE_WEBHOOK_SECRET }}
          HETZNER_S3_ENDPOINT: ${{ vars.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_REGION: ${{ vars.HETZNER_S3_REGION }}
          HETZNER_QUARANTINE_BUCKET: ${{ vars.HETZNER_QUARANTINE_BUCKET }}
          HETZNER_SOURCES_BUCKET: ${{ vars.HETZNER_SOURCES_BUCKET }}
          HETZNER_S3_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY_ID }}
          HETZNER_S3_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_ACCESS_KEY }}
