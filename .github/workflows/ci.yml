# Independent validation; successful main commits trigger the separate staging workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded validation can stop without interrupting a staging rollout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Compare the tested PR merge commit with its event base; main still validates every task.
env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bunx turbo run typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=2

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # One package and one test-file worker at a time share this runner's Docker/CPU budget.
      - run: >-
          bunx turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=1
          --filter=@nunio/db --filter=@nunio/delegation --filter=@nunio/billing --filter=@nunio/knowledge
          --filter=@nunio/identity --filter=@nunio/api --filter=@nunio/planning
          -- --maxWorkers=1 --reporter=default --reporter=json --outputFile=.turbo/tests.json
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: backend-test-diagnostics
          include-hidden-files: true
          path: |
            **/.turbo/tests.json
            **/.turbo/turbo-*.log
            !**/node_modules/**

  temporal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: >-
          bunx turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }} --filter=@nunio/worker --concurrency=2
          -- --maxWorkers=1 --reporter=default --reporter=json --outputFile=.turbo/tests.json
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: temporal-test-diagnostics
          include-hidden-files: true
          path: |
            **/.turbo/tests.json
            **/.turbo/turbo-*.log
            !**/node_modules/**

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: PDF parser tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf util-linux
      - run: >-
          bunx turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=2
          --filter=@nunio/parser --filter=@nunio/ai --filter=@nunio/commitlint-config --filter=@nunio/keys --filter=@nunio/web
          -- --maxWorkers=1
          --reporter=default --reporter=json --outputFile=.turbo/tests.json
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: unit-test-diagnostics
          include-hidden-files: true
          path: |
            **/.turbo/tests.json
            **/.turbo/turbo-*.log
            !**/node_modules/**

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/ui
      - run: >-
          bunx turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }} --filter=@nunio/ui --concurrency=2
          -- --maxWorkers=1 --reporter=default --reporter=json --outputFile=.turbo/tests.json
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ui-test-diagnostics
          include-hidden-files: true
          path: |
            **/.turbo/tests.json
            **/.turbo/turbo-*.log
            packages/ui/**/__screenshots__/**
            !**/node_modules/**

  build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - run: bunx turbo run build ${{ github.event_name == 'pull_request' && '--affected' || '' }} --concurrency=2
      - name: Local HTTPS names for the e2e suite
        run: echo "127.0.0.1 app.nunio.test api.nunio.test evil.test" | sudo tee -a /etc/hosts
      - run: bun run test:e2e --concurrency=2
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: local-e2e-diagnostics
          include-hidden-files: true
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            **/.turbo/turbo-*.log
            !**/node_modules/**

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: openapi.json is up to date (ADR-0003)
        run: |
          bun run openapi --concurrency=2
          git diff --exit-code -- apps/api/openapi.json \
            || { echo "::error::apps/api/openapi.json is stale; run 'bun run openapi' and commit it."; exit 1; }

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Commit messages follow the rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE" --to "$HEAD" --verbose

  # Always evaluate prerequisites: a skipped dependent job must not turn a failed lane green.
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-jobs
  checks:
    if: always()
    needs:
      [
        lint,
        typecheck,
        backend-tests,
        temporal-tests,
        unit-tests,
        ui-tests,
        build-e2e,
        openapi,
        commits,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: All required checks succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -e 'all(to_entries[];
            if .key == "commits" and env.EVENT_NAME != "pull_request"
            then .value.result == "skipped"
            else .value.result == "success"
            end)'
