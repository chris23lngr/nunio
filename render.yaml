# Render Blueprint (plan, Phase 2 "Render"; ADR-0004). Deploys are triggered by CI, never by pushes.
services:
  - type: worker
    name: nunio-worker-staging
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    # No rootDir: it breaks turbo prune. Build from the repo root.
    dockerContext: .
    dockerfilePath: ./apps/worker/Dockerfile
    autoDeployTrigger: "off"
    buildFilter:
      paths: [apps/worker/**, packages/**, package.json, bun.lock, turbo.json]
    # Render waits this long after SIGTERM; the worker drains for SHUTDOWN_GRACE_SECONDS (less).
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TEMPORAL_ADDRESS
        value: nunio-staging.lta09.tmprl.cloud:7233
      - key: TEMPORAL_NAMESPACE
        value: nunio-staging.lta09
      - key: TEMPORAL_TASK_QUEUE
        value: spike-d
      - key: CODEC_KEY_VERSION
        value: v1
      - key: SHUTDOWN_GRACE_SECONDS
        value: "25"
      - key: PARSER_HOSTPORT
        fromService:
          type: pserv
          name: nunio-parser-staging
          property: hostport
      - key: TEMPORAL_API_KEY
        sync: false
      - key: CODEC_KEY
        sync: false
      # Optional during rotation: {"<old version>":"<base64 32-byte key>"}, decode-only.
      - key: CODEC_PREVIOUS_KEYS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SOURCE_MASTER_KEYS
        sync: false
      - key: HETZNER_S3_ACCESS_KEY_ID
        sync: false
      - key: HETZNER_S3_SECRET_ACCESS_KEY
        sync: false
      - key: HETZNER_QUARANTINE_BUCKET
        sync: false
      - key: HETZNER_SOURCES_BUCKET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Notification email (ADR-0014): a send-only Scaleway key and sender of the worker's own.
      - key: NOTIFY_SCW_SECRET_KEY
        sync: false
      - key: SCW_PROJECT_ID
        sync: false
      - key: NOTIFY_EMAIL_FROM
        sync: false
      # The app origin the Inbox link in every email points to.
      - key: APP_ORIGIN
        sync: false
      # Browser push (ADR-0008 amendment of 2026-11-09): the VAPID key pair and a mailto: contact.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SOURCE_KEY_VERSION
        value: v1
      - key: HETZNER_S3_ENDPOINT
        value: https://fsn1.your-objectstorage.com
      - key: HETZNER_S3_REGION
        value: fsn1
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_DISABLED
        value: "false"

  # ADR-0009: no public URL, no secrets (the parser refuses to start with any), reached by the worker.
  - type: pserv
    name: nunio-parser-staging
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    dockerContext: .
    dockerfilePath: ./apps/parser/Dockerfile
    autoDeployTrigger: "off"
    buildFilter:
      paths: [apps/parser/**, packages/**, package.json, bun.lock, turbo.json]
    envVars:
      - key: PORT
        value: "10000"

      - key: PARSER_STORAGE_ENDPOINT
        value: https://fsn1.your-objectstorage.com
      - key: PARSER_QUARANTINE_BUCKET
        sync: false
